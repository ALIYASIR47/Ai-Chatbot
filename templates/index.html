<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Gemini Powered</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar for Chat History -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Chat History</h2>
                <button class="close-sidebar" onclick="toggleSidebar()">×</button>
            </div>

            <div class="history-filters">
                <button class="filter-btn active" onclick="filterHistory('today')">Today</button>
                <button class="filter-btn" onclick="filterHistory('week')">Previous Week</button>
                <button class="filter-btn" onclick="filterHistory('older')">Older</button>
                <button class="filter-btn" onclick="filterHistory('all')">All</button>
            </div>

            <div class="history-list" id="history-list">
                <!-- History items will be loaded here -->
            </div>

            <button class="clear-history-btn" onclick="clearHistory()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
                Clear All History
            </button>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-content">
                    <div class="bot-avatar-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            <circle cx="9" cy="16" r="1"></circle>
                            <circle cx="15" cy="16" r="1"></circle>
                        </svg>
                    </div>
                    <div>
                        <h1>AI Assistant</h1>
                        <p class="status">Powered by Gemini 2.5</p>
                    </div>
                </div>
            </div>

            <div class="chat-container" id="chat-box">
                <div class="welcome-message">
                    <div class="bot-avatar-large">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            <circle cx="9" cy="16" r="1"></circle>
                            <circle cx="15" cy="16" r="1"></circle>
                        </svg>
                    </div>
                    <h2>Welcome to AI Assistant</h2>
                    <p>I'm here to help you with any questions or tasks. How can I assist you today?</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="user-input"
                        placeholder="Type your message here..."
                        onkeypress="if(event.key === 'Enter') sendMessage();"
                        autocomplete="off"
                    >
                    <button class="send-btn" onclick="sendMessage()" id="send-btn">
                        <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        <span class="send-text">Send</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=5"></script>
</body>
</html>
